<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17121b"><title>BETONCHI</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head>
<body><div id="app">
<header><div><span>BETONCHI</span><small>virtual baby</small></div><div class="hearts">♥ <b id="happy">82</b></div></header>
<div class="meters"><label>⚡ <i><em id="energyBar"></em></i></label><label>♫ <i><em id="readyBar"></em></i></label></div>
<main>
<section class="screen active" id="home"><div class="scene"><img id="mainImg" src="assets/home.png"><div class="speech" id="speech">Bugün neler yapalım? ♡</div></div><div class="actions"><button data-page="food">🍜<b>Yemek</b></button><button data-page="outfit">👕<b>Kombin</b></button><button data-page="rehearsal">🎸<b>Prova</b></button><button data-page="rest">☾<b>Dinlen</b></button><button data-page="concert">★<b>Konser</b></button></div></section>
<section class="screen" id="food"><h2>Yemek</h2><div class="scene foodScene"><img id="foodImg" src="assets/food.png"><div class="effect" id="foodEffect"></div></div><p class="hint">Bir yemek seç. Beton seçtiğini yesin.</p><div class="selector food"><button data-food="Noodle">🍜<b>Noodle</b></button><button data-food="Pizza">🍕<b>Pizza</b></button><button data-food="Pasta">🍝<b>Pasta</b></button><button data-food="Tatlı">🍰<b>Tatlı</b></button><button data-food="Kahve">☕<b>Kahve</b></button></div></section>
<section class="screen" id="outfit"><h2>Kombin</h2><div class="scene outfitScene"><img src="assets/outfit.png"><div class="clothes" id="clothes"><div class="top"></div><div class="bottom"></div></div></div><p class="hint">Seçtiğin kombin Beton'un üstünde anında görünür.</p><div class="selector outfits"><button data-look="classic">🖤<b>Günlük</b></button><button data-look="stage">🎤<b>Sahne</b></button><button data-look="soft">☁️<b>Rahat</b></button><button data-look="winter">🧥<b>Kış</b></button></div></section>
<section class="screen" id="rehearsal"><h2>Prova</h2><div class="scene"><img src="assets/rehearsal.png"><div class="speech">Prova yapılıyor… 🎸</div></div><button class="primary" id="rehearse">PROVAYI TAMAMLA</button></section>
<section class="screen" id="rest"><h2>Dinlenme</h2><div class="scene"><img src="assets/rest.png"><div class="speech">zZz… enerji yenileniyor ♡</div></div><button class="primary" id="wake">UYANDIR</button></section>
<section class="screen" id="concert"><h2>Konser ★</h2><div class="scene concertScene"><img src="assets/concert.png"><div class="lights"></div><div class="speech" id="concertMsg">Sahne hazır. Beton'un kombini de hazır.</div></div><button class="primary" id="perform">KONSERİ BAŞLAT</button></section>
</main>
<nav><button data-page="home">⌂<small>Ana</small></button><button data-page="food">🍴<small>Yemek</small></button><button data-page="outfit">♙<small>Kombin</small></button><button data-page="rehearsal">♬<small>Prova</small></button><button data-page="concert">★<small>Konser</small></button></nav>
</div><script src="app.js"></script></body></html>
